<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>迷你留言板</title>
  <style>
    body { font-family: system-ui, -apple-system, "PingFang SC", sans-serif;
           max-width: 640px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 24px; }
    .msg { border: 1px solid #e3e3e3; border-radius: 8px; padding: 12px 14px; margin: 12px 0; }
    .meta { color: #999; font-size: 13px; margin-bottom: 6px; }
    .content { white-space: pre-wrap; line-height: 1.5; }
    form.post { margin-top: 28px; background: #fafafa; padding: 16px; border-radius: 8px; }
    input, textarea { width: 100%; box-sizing: border-box; padding: 8px;
                      margin: 6px 0; border: 1px solid #ccc; border-radius: 6px;
                      font-family: inherit; }
    button { padding: 8px 18px; cursor: pointer; border: none; border-radius: 6px;
             background: #1f77b4; color: #fff; font-size: 14px; }
    button.del { background: #e74c3c; padding: 4px 10px; font-size: 12px; }
    .empty { color: #999; }
  </style>
</head>
<body>
  <h1>💬 迷你留言板</h1>

  {% for m in messages %}
    <div class="msg">
      <div class="meta"><strong>{{ m['name'] }}</strong> · {{ m['created_at'] }}</div>
      <div class="content">{{ m['content'] }}</div>
      <form action="{{ url_for('delete', mid=m['id']) }}" method="POST" style="margin:8px 0 0">
        <button class="del" type="submit">删除</button>
      </form>
    </div>
  {% else %}
    <p class="empty">还没有留言，来发第一条吧！</p>
  {% endfor %}

  <form action="{{ url_for('add') }}" class="post" method="POST">
    <input name="name" placeholder="你的昵称（可选）">
    <textarea name="content" placeholder="说点什么..." required rows="3"></textarea>
    <button type="submit">发布留言</button>
  </form>
</body>
</html>
